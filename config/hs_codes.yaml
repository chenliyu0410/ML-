# =====================================================================
# 稅則號別清單 — 本專案最重要的一個檔案
# ---------------------------------------------------------------------
# 模型誰都能跑，但「知道 2309.90 裡哪些分項才算寵物食品」需要領域知識。
# 每一筆都必須填 rationale（納入/排除的理由）與 source（查證來源）。
# 沒有理由的號列，等同沒有查證過。
#
# 查證入口：關務署稅則稅率查詢 https://web.customs.gov.tw
# 下載入口：關港貿單一窗口     https://portal.sw.nat.gov.tw/APGA/GA30
# =====================================================================

meta:
  schema_version: 1
  last_reviewed: null          # 每次查證後填入 YYYY-MM-DD
  reviewed_by: null
  # 台灣使用 11 碼 CCC 號列 = HS 6 碼 + 稅則 2 碼 + 統計 2 碼 + 檢查碼 1 碼
  # 決定分析粒度：hs6（跨國可比）或 ccc11（本國最細）
  granularity: hs6

# ---------------------------------------------------------------------
# 已確認納入
# ---------------------------------------------------------------------
include:
  - code: "2309.10"
    name_zh: 犬或貓食品，零售包裝
    name_en: Dog or cat food, put up for retail sale
    tier: core                 # core | secondary
    status: confirmed
    rationale: >
      核心稅號，零售包裝犬貓食品專用，定義明確無混雜。
      本專案的主戰場，單價趨勢分析以此為主軸。
    source: null               # 填查詢日期與頁面，例如 "關務署稅則查詢, 2026-08-04"

  - code: "2309.90"
    name_zh: 其他動物飼料調製品
    name_en: Other preparations used in animal feeding
    tier: secondary
    status: needs_subitem_review
    rationale: >
      含部分散裝／非零售包裝寵物飼料，但同時混入畜牧飼料、水產飼料。
      不可整筆納入，必須下鑽到 CCC 11 碼逐項判讀。
      未完成判讀前，分析時應標記為 uncertain 並做敏感度測試。
    source: null
    subitems:                  # 下鑽後在此逐項列出 11 碼與判定
      # - code: "2309900000"
      #   name_zh: ...
      #   decision: include | exclude
      #   rationale: ...

# ---------------------------------------------------------------------
# 待查證 — 決定前不要開始建模
# ---------------------------------------------------------------------
pending:
  - code_candidates: ["1602", "2309.10"]
    item_zh: 寵物肉乾 / 潔牙骨
    question: >
      調製肉類（1602）與零售包裝寵物食品（2309.10）的分界為何？
      實務上報關歸屬哪一類？是否因品牌／型態而異？
    impact: >
      若大量落在 1602 而未納入，會低估高單價品項，直接削弱精緻化假設的證據。
    status: open

  - code_candidates: ["2106", "3004"]
    item_zh: 寵物保健品 / 營養補充
    question: >
      食品調製品（2106）與藥品（3004）如何區分？
      3004 涉及動物用藥管制，是否應留給 Phase 2？
    impact: >
      單價極高，納入與否會明顯影響整體平均單價，需明確界定並在報告揭露。
    status: open

  - code_candidates: ["2508", "3824"]
    item_zh: 貓砂（礦砂 / 豆腐砂 / 水晶砂）
    question: 依材質分散於礦產品與化學製品，是否有統一號列？
    impact: >
      非食品。傾向排除，但若研究主題擴大為「寵物消耗品」則需納入。
      目前範圍界定為寵物「食品」，預設排除。
    status: open
    tentative_decision: exclude

# ---------------------------------------------------------------------
# 明確排除 — 排除理由同樣要寫，之後才不會重複討論
# ---------------------------------------------------------------------
exclude:
  - code: "2309.90"
    scope: 畜牧用飼料（豬、牛、雞）分項
    rationale: 非寵物食品，且受農業景氣與飼料原物料驅動，混入會污染單價訊號。

  - code: "3004"
    scope: 動物用藥
    rationale: 受管制、有許可證制度、樣本稀疏，資料結構差異大，列為 Phase 2 獨立分析。

# ---------------------------------------------------------------------
# HS 版本改版對照 — 序列斷點的主要來源
# ---------------------------------------------------------------------
# 2017 / 2022 兩次改版可能造成號列不連續。
# 若確認有斷點，在此建立新舊對照，clean.py 會據此接續序列。
hs_revisions:
  - year: 2017
    checked: false
    has_break: null            # true / false / null(未檢查)
    crosswalk: []              # - {old: "...", new: "...", note: "..."}
  - year: 2022
    checked: false
    has_break: null
    crosswalk: []

# ---------------------------------------------------------------------
# 對照組 — 用來排除「整體物價普遍上漲」這個競爭解釋
# 唯有寵物食品實質單價漲幅顯著高於對照組，精緻化結論才成立
# ---------------------------------------------------------------------
control_group:
  name: 一般食品類進口
  codes: []                    # 例如 HS 第 16–21 章的代表性號列，待選定
  rationale: >
    需挑選與寵物食品原料重疊（肉類、穀物）但非寵物用途的品項，
    才能分離「原物料上漲」與「產品精緻化」兩種效果。
  status: open
