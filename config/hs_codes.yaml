# =====================================================================
# 稅則號別清單 — 本專案最重要的一個檔案
# ---------------------------------------------------------------------
# 模型誰都能跑，但「知道寵物零食歸在皮革章而不是食品章」需要領域知識。
# 每一筆都必須填 rationale（納入/排除的理由）與 source（查證來源）。
# 沒有理由的號列，等同沒有查證過。
#
# 查證入口：
#   貨品歸屬稅則查詢（中文模糊搜尋，較好用） https://hscode.customs.gov.tw/
#   稅則稅率綜合查詢 GC411                    https://portal.sw.nat.gov.tw/APGQ/GC411
# =====================================================================

meta:
  schema_version: 2
  last_reviewed: null          # 每次查證後填入 YYYY-MM-DD
  reviewed_by: null

  # 台灣使用 11 碼 CCC 號列 = HS 6 碼 + 稅則 2 碼 + 統計 2 碼 + 檢查碼 1 碼
  # 本專案採 ccc11：核心的兩個號列本來就是 11 碼定義，降到 hs6 會把
  # 4205.00.90.10-4 混進整個「其他皮革製品」，訊號會被稀釋掉。
  granularity: ccc11

  # 品類邊界的權威定義來源。不要自己揣測什麼算寵物食品 ——
  # 主管機關的檢疫條件已經定義好了，直接引用。
  authority:
    name: 農業部動植物防疫檢疫署「犬貓寵物食品輸入檢疫條件」
    definition: >
      含偶蹄目或禽鳥類動物性成分、供犬貓食用或嚼咬，
      且歸屬 2309.10.00.00-2 或 4205.00.90.10-4 之產品。
    note: 這是最權威的品類邊界，report 裡引用它比自己定義有說服力。

# ---------------------------------------------------------------------
# 已確認納入 — 兩個都要抓，缺一不可
# ---------------------------------------------------------------------
include:
  - code: "2309.10.00.00-2"
    code_query: "23091000002"      # 單一窗口「指定貨品號列」欄位貼這個（無分隔符）
    hs6: "2309.10"
    chapter: 23
    name_zh: 供零售用之貓狗食品
    name_en: Dog or cat food, put up for retail sale
    unit: KGM
    tariff_rate: 0.02
    permit_codes: [B01, MP1]
    tier: core
    status: confirmed
    rationale: >
      核心稅號，零售包裝犬貓食品專用，定義明確無混雜。
      主食（乾糧、濕糧、罐頭）的主戰場，進口量體最大。
    source: 防檢署犬貓寵物食品輸入檢疫條件 + 稅則稅率查詢

  - code: "4205.00.90.10-4"
    code_query: "42050090104"
    hs6: "4205.00"
    chapter: 42                    # ← 皮革章，不是食品章
    name_zh: 由動物皮製成供寵物嚼咬之製品
    name_en: Articles of leather for pet chewing
    unit: null                     # 待確認，可能非 KGM
    tariff_rate: null              # 待確認
    permit_codes: [B01]
    tier: core
    status: confirmed
    rationale: >
      寵物咬膠、潔牙骨、牛皮骨這類「寵物零食」歸在皮革章第 42 章，
      不在食品章第 23 章。只抓 2309.10 的話，整個零食品類會憑空消失。

      這件事對本專案的核心結論影響極大：零食恰好是精緻化程度最高、
      單價最貴的品類。漏掉它，「精緻化」的證據會嚴重失真 —— 而且是
      往低估的方向失真，可能讓成立的假設看起來不成立。
    source: 防檢署犬貓寵物食品輸入檢疫條件
    caveats: >
      本號列僅涵蓋「動物皮製」嚼咬物。非皮製的肉乾、肉條可能落在 1602，
      見 pending。因此第 42 章不等於「全部寵物零食」，只是其中一塊。

# ---------------------------------------------------------------------
# 簽審規定 — 不只是法遵欄位，有分析價值
# ---------------------------------------------------------------------
permit_codes:
  B01:
    meaning: 須憑防檢署輸入檢疫合格證始准進口
    analytical_value: >
      代表另有一份「輸入檢疫核准紀錄」存在，可與海關統計交叉比對。
      是潛在的差異化資料源（可看到品牌/廠商層級，海關統計看不到）。
    action: 選配，Phase 2 再評估是否申請調閱。

  MP1:
    meaning: 大陸物品有條件准許輸入
    restriction: 中國大陸來源僅開放「乾狗糧（牛肉口味）」一項（EX 註記）
    analytical_value: >
      ★ 建模時必須知道這件事。中國的進口數字天生受法規壓抑，
      是結構性因素，不是市場偏好。
    failure_mode: >
      不知道這條管制的人，看到中國進口量偏低會誤判成
      「台灣消費者不愛中國品牌」—— 但真相是法規根本不讓進。
    action: >
      中國大陸來源需單獨標記 is_regulated=True，
      並在分群與特徵重要度解讀時排除或單獨討論。
      見 config/params.yaml 的 regulatory 區塊。

# ---------------------------------------------------------------------
# 待查證 — 決定前不要開始建模
# ---------------------------------------------------------------------
pending:
  - code_candidates: ["1602"]
    item_zh: 寵物肉乾 / 肉條（非皮製）
    question: >
      非皮製的肉乾、肉條是否落在 1602 調製肉類？
      與 4205 的分界是「材質為動物皮」還是「型態為嚼咬物」？
    impact: >
      4205 只涵蓋皮製嚼咬物。若肉條大量落在 1602 而未納入，
      零食品類仍然不完整，精緻化的證據依舊會低估。
    status: open

  - code_candidates: ["2106", "3004"]
    item_zh: 寵物保健品 / 營養補充
    question: >
      食品調製品（2106）與藥品（3004）如何區分？
      3004 涉及動物用藥管制，是否應留給 Phase 2？
    impact: >
      單價極高，納入與否會明顯影響整體平均單價，需明確界定並在報告揭露。
    status: open

  - code_candidates: ["2309.90"]
    item_zh: 散裝、非零售包裝寵物飼料
    question: >
      2309.90 混入畜牧飼料與水產飼料，需下鑽到 11 碼逐項判讀，
      哪些分項真的是寵物用？
    impact: >
      散裝多為低單價，納入會拉低平均單價。若納入標準前後不一致，
      會製造假的單價趨勢，直接污染 Phase 1 的結論。
    status: open
    subitems: []               # 下鑽後在此逐項列出 11 碼與 include/exclude 判定

  - code_candidates: ["2508", "3824"]
    item_zh: 貓砂（礦砂 / 豆腐砂 / 水晶砂）
    question: 依材質分散於礦產品與化學製品，是否有統一號列？
    impact: >
      非食品，且不在防檢署的犬貓食品定義內。
      本階段範圍界定為寵物「食品」，建議 Phase 1 排除。
    status: open
    tentative_decision: exclude

# ---------------------------------------------------------------------
# 明確排除 — 排除理由同樣要寫，之後才不會重複討論
# ---------------------------------------------------------------------
exclude:
  - code: "2309.90"
    scope: 畜牧用飼料（豬、牛、雞）與水產飼料分項
    rationale: >
      非寵物食品，且受農業景氣與飼料原物料驅動，混入會污染單價訊號。
      註：同號列的寵物用分項仍在 pending，待下鑽後分離。

  - code: "3004"
    scope: 動物用藥
    rationale: 受管制、有許可證制度、樣本稀疏，資料結構差異大，列為 Phase 2 獨立分析。

# ---------------------------------------------------------------------
# HS 版本改版對照 — 序列斷點的主要來源
# ---------------------------------------------------------------------
hs_revisions:
  - year: 2017
    checked: false
    has_break: null            # true / false / null(未檢查)
    crosswalk: []              # - {old: "...", new: "...", note: "..."}
  - year: 2022
    checked: false
    has_break: null
    crosswalk: []

# ---------------------------------------------------------------------
# 對照組 — 用來排除「整體物價普遍上漲」這個競爭解釋
# 唯有寵物食品實質單價漲幅顯著高於對照組，精緻化結論才成立
# ---------------------------------------------------------------------
control_group:
  name: 一般食品類進口
  codes: []                    # 例如 HS 第 16–21 章的代表性號列，待選定
  rationale: >
    需挑選與寵物食品原料重疊（肉類、穀物）但非寵物用途的品項，
    才能分離「原物料上漲」與「產品精緻化」兩種效果。
  status: open
