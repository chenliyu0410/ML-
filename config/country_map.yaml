# =====================================================================
# 國名標準化對照表
# ---------------------------------------------------------------------
# 海關資料的國名寫法不一致（中國大陸 / 中國 / CHINA、美國 / USA…）。
# 不統一的話，同一個國家會被拆成好幾條時間序列，每條都變得稀疏，
# lag 特徵全部斷裂 —— 這是最容易發生又最難察覺的資料錯誤之一。
#
# canonical 一律用繁體中文全名，與海關統計的主要寫法一致。
# =====================================================================

meta:
  schema_version: 1
  canonical_language: zh-TW
  # 未命中的國名一律 warn，不可靜默通過。
  # 靜默 fallback 會讓新出現的國家被歸到錯的地方，且沒人發現。
  on_unmatched: warn           # warn | raise | ignore

aliases:
  中國大陸:
    - 中國
    - 中国
    - 中國大陸地區
    - CHINA
    - CN
    - CHINA (MAINLAND)
    - 大陸

  美國:
    - USA
    - US
    - U.S.A.
    - UNITED STATES
    - UNITED STATES OF AMERICA
    - 美利堅合眾國

  南韓:
    - 韓國
    - 大韓民國
    - KOREA
    - KOREA, REPUBLIC OF
    - SOUTH KOREA
    - KR

  英國:
    - UK
    - UNITED KINGDOM
    - GREAT BRITAIN
    - GB
    - 大不列顛

  泰國:
    - THAILAND
    - TH

  越南:
    - VIETNAM
    - VIET NAM
    - VN

  日本:
    - JAPAN
    - JP

  加拿大:
    - CANADA
    - CA

  澳大利亞:
    - 澳洲
    - AUSTRALIA
    - AU

  紐西蘭:
    - 新西蘭
    - NEW ZEALAND
    - NZ

  德國:
    - GERMANY
    - DE

  法國:
    - FRANCE
    - FR

  荷蘭:
    - NETHERLANDS
    - HOLLAND
    - NL

  義大利:
    - 意大利
    - ITALY
    - IT

  西班牙:
    - SPAIN
    - ES

  比利時:
    - BELGIUM
    - BE

  捷克:
    - 捷克共和國
    - CZECH REPUBLIC
    - CZECHIA
    - CZ

  香港:
    - HONG KONG
    - HK

  新加坡:
    - SINGAPORE
    - SG

  馬來西亞:
    - MALAYSIA
    - MY

# ---------------------------------------------------------------------
# 需要人工判斷的特殊值 —— 不要自動歸併
# ---------------------------------------------------------------------
special:
  - value: 其他國家
    note: 海關的殘差項，不是真的國家。稀疏序列併入時要小心不要跟它撞在一起。
  - value: 未列名國家
    note: 同上。
  - value: 保稅區
    note: 非最終來源國，可能是轉口。分析來源國偏好時應排除或單獨處理。

# ---------------------------------------------------------------------
# 尚未整理的寫法 —— parse_downloads 遇到未命中時把國名記在這裡
# ---------------------------------------------------------------------
unmatched_log: []
